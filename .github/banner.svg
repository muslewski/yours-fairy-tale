<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Yours Fairy Tale — an animated fairy tale made for them.">
  <defs>
    <clipPath id="panel">
      <rect x="28" y="28" width="1224" height="344" rx="34" />
    </clipPath>
    <!-- normalized 4-point sparkle, r = 1 -->
    <path id="spark" d="M0,-1 L0.24,-0.24 L1,0 L0.24,0.24 L0,1 L-0.24,0.24 L-1,0 L-0.24,-0.24 Z" />
  </defs>

  <!-- cream page -->
  <rect width="1280" height="400" fill="#fff9ee" />

  <!-- white panel + thick comic frame -->
  <rect x="28" y="28" width="1224" height="344" rx="34" fill="#ffffff" stroke="#1a1033" stroke-width="8" />

  <!-- decorative night sky, clipped to the panel -->
  <g clip-path="url(#panel)">
    <!-- planet drifting off the right edge -->
    <circle cx="1140" cy="200" r="190" fill="#17c7e2" opacity="0.16" />
    <circle cx="1140" cy="200" r="120" fill="#17c7e2" opacity="0.22" stroke="#1a1033" stroke-width="6" />
    <circle cx="1095" cy="150" r="22" fill="#fff9ee" opacity="0.5" />
    <circle cx="1175" cy="235" r="14" fill="#fff9ee" opacity="0.5" />
    <!-- scattered sparkles -->
    <use href="#spark" transform="translate(980,90) scale(26)" fill="#faca23" />
    <use href="#spark" transform="translate(1218,300) scale(20)" fill="#f042d2" />
    <use href="#spark" transform="translate(900,320) scale(15)" fill="#17c7e2" />
    <use href="#spark" transform="translate(1040,330) scale(11)" fill="#1a1033" opacity="0.5" />
  </g>

  <!-- wordmark -->
  <g transform="translate(72,86)">
    <circle cx="26" cy="0" r="26" fill="#faca23" stroke="#1a1033" stroke-width="5" />
    <use href="#spark" transform="translate(26,0) scale(13)" fill="#1a1033" />
    <text x="68" y="11" font-family="'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif" font-weight="600" font-size="34" fill="#1a1033">Yours Fairy Tale</text>
  </g>

  <!-- headline -->
  <g font-family="'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif" fill="#1a1033">
    <text x="72" y="208" font-weight="600" font-size="62">An animated fairy tale</text>
    <text x="72" y="276" font-weight="600" font-size="62">made for them.</text>
  </g>

  <!-- subtitle -->
  <text x="74" y="318" font-family="'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif" font-weight="400" font-size="25" fill="#1a1033" opacity="0.7">Personalized animated videos starring your child.</text>

  <!-- comic-shadow badge -->
  <g transform="translate(74,338)">
    <rect x="6" y="6" width="372" height="44" rx="13" fill="#1a1033" />
    <rect x="0" y="0" width="372" height="44" rx="13" fill="#faca23" stroke="#1a1033" stroke-width="4" />
    <text x="186" y="29" text-anchor="middle" font-family="'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif" font-weight="600" font-size="22" fill="#1a1033">40,000+ children already starring</text>
  </g>
</svg>
