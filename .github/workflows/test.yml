# CI — typecheck, vitest, and Playwright Layer A & B on every PR and main push.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   TEST_DATABASE_URI          — Neon test-branch connection string
#   PAYLOAD_SECRET             — Payload CMS secret
#   BETTER_AUTH_SECRET         — Better Auth secret
#   STRIPE_SECRET_KEY          — Stripe secret key (test mode)
#   STRIPE_PUBLISHABLE_KEY     — Stripe publishable key (test mode)
#
# @smoke tests are intentionally excluded — they require `stripe listen` and
# are not run in CI. Use test:e2e:smoke locally.

name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: vitest + Playwright (A/B)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Write .env.test
        run: |
          cat > .env.test <<EOF
          DATABASE_URI=${{ secrets.TEST_DATABASE_URI }}
          PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL=http://localhost:3100
          PLAYWRIGHT_TEST=1
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached path)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run vitest
        run: npm run test

      - name: Run Playwright A/B (webServer builds + starts the app)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
